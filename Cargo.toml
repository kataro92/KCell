[workspace]
resolver = "2"
members = [
    "crates/kcell-core",
    "crates/kcell-cli",
    "adapters/kcell-mcp",
    "adapters/kcell-agui",
    "adapters/kcell-a2a",
]
default-members = ["crates/kcell-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/kataro92/KCell"
homepage = "https://github.com/kataro92/KCell"
authors = ["KCell contributors"]

[workspace.dependencies]
kcell_core = { path = "crates/kcell-core", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
