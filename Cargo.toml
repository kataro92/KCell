[workspace]
resolver = "2"
members = [
    "crates/kcell-core",
    "crates/kcell-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kataro92/KCell"

[workspace.dependencies]
kcell_core = { path = "crates/kcell-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
